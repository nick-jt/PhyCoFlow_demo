# ICLR SHIFT-WING run: surface-only observations -> volumetric flow posterior.
# Observations are drawn from the surface pool (Cp + wall shear) with
# freestream Mach/alpha parameter tokens; queries are near-body volume nodes.
Demo_Num: 19
device_ids: [0]

dataset: "shiftwing"
processed_root: "/projects/ammoniacomb/generative_reconstruction/shift_wing/processed_v3"
data: "../Dataset/JHU_TurbulenceDataset.h5"   # unused for shiftwing; kept for arg parity
save_dir: "Save_TrainedModel/wing/pointcloud_ffm/iclr_wing_v4_sym"

seed: 42
epochs: 4000
batch_size: 8
lr: 1.0e-4
weight_decay: 3.0e-5
train_ratio: 0.9        # unused for shiftwing (split stored in stats.json)
time_stride: 1
num_workers: 6
field_names: ["Ux", "Uy", "Uz", "Cp"]

backbone: "GL_rbf_ENH"

hidden_dim: 256
cond_dim: 128
field_embed_dim: 128
sigma_min: 1.0e-4
rbf_sigma: 0.05

USE_FOURIER_PE: true
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0

latent_dim: 256
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
decode_chunk_size: 4096
share_query_proj: false

summary_type: "mean"

gather_mode: "topk_rbf_glres"
gather_topk: 16
sensor_local_topk: 16
gather_query_chunk_size: 2048
learnable_rbf_sigma: true
neighbor_backend: "keops"
sensor_local_dropout: 0.0

sensor_coord_encoding: "fourier"
latent_sensor_reinject: true
latent_reinject_every: 1
query_latent_readout: true
query_readout_type: "coord"
query_readout_scale_init: 1.0e-2
enhanced_head_norm: true
glres_scale_init: 1.0e-2

n_query_points: 16384
query_sampling: "uniform"
query_sample_near_ratio: 0.25
query_sample_far_ratio: 0.25
query_sample_sigma_ratio: 0.05
prior: "rff"
rff_features: 256
rff_lengthscale: 0.15

eval_every: 25
save_every: 1000000     # visualization benchmark is JHU-specific; wing eval is a separate script

# Pool channels: [Cp_surface, tau_x, tau_y, tau_z]. Realistic tap budgets:
# up to 4096 pressure taps, sparser shear sensing.
cond_fields: [3]        # informational only in pool mode
n_obs_min_list: [64, 16, 16, 16]
n_obs_max_list: [4096, 1024, 1024, 1024]

vis_cond_fields:
vis_n_obs_list:

ode_solver: "euler"
benchmark_n_steps: [2, 4, 16]
n_steps_generation: 32

use_amp: true
ema_decay: 0.9995
measurement_ops:
  noise_sigma_min: 0.0
  noise_sigma_max: 0.1
  occlusion_prob: 0.2
  occlusion_kind: "ball"
  occlusion_frac_min: 0.1
  occlusion_frac_max: 0.3
  field_dropout_prob: 0.3

t_sampling: "logit_normal"
compile_model: true
