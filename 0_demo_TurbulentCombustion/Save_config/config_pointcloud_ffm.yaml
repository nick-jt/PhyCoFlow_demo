
#----------------------------------------------------------

# Notes: Changing to V5 version: multi-field sparse encoding + 
#                         Rectified Flow + Perceiver backbone + Global-Local mode + "multiple decoding gathering modes"

#----------------------------------------------------------
# GL_rbf backbone scaled to ~20.4M trainable params for fair comparison with LatentFM baseline (~20.9M).
# Key changes vs earlier runs:
#   latent_dim 256→384, num_latents 128→256, num_latent_blocks 4→8 (parameter parity)
#   n_obs_max_list 5000→19531 (1% sensor budget, matching baseline)
#----------------------------------------------------------

Demo_Num: 2
device_ids: [0]

#data: "../Dataset/Merged_CH4COTU1P.h5"
data: "../Dataset/JHU_TurbulenceDataset.h5"
save_dir: "Save_TrainedModel/ffm_tc_pointcloud_match_lfm"

seed : 42
epochs : 10000
batch_size : 8
lr : 1.0e-4
weight_decay : 1.0e-6
train_ratio : 0.9
time_stride : 1
num_workers : 4
field_names: ["Ux", "Uy", "Uz", "p"]

# ----------------------------------------------------------
# Backbone selection
# ----------------------------------------------------------
backbone: "GL_rbf" # Selection in ["mlp_rbf", "perceiver", "fno", "GL_rbf"]

# ----------------------------------------------------------
# Hyperparameters for mlp_rbf backbone # ignore (per Linzheng)
# ----------------------------------------------------------
hidden_dim : 256
cond_dim : 128
field_embed_dim : 128
sigma_min : 1.0e-4    # legacy FFM key; unused in 1-RF, kept only for config compatibility
rbf_sigma : 0.05
USE_FOURIER_PE: true   # If true, point_encoder uses Fourier positional coordinate features instead of raw coords.
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0

# ----------------------------------------------------------
# Hyperparameters for Perceiver backbone or GL_rbf # Keep the same between
# ----------------------------------------------------------
latent_dim: 384           # widened from 256; 3× baseline AE latent_ch=128, compensates for ~32× fewer latent tokens vs 4096 AE spatial positions
num_latents: 256          # doubled from 128 to increase global capacity
num_heads: 8
num_latent_blocks: 8      # doubled from 4; together with latent_dim=384 reaches ~20.4M params ≈ baseline's 20.9M trainable
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
decode_chunk_size: 4096
share_query_proj: false

summary_type: "mean" # Only for GL_rbf, mean or cls

gather_mode: "topk_rbf_glres"  # choices: ["rbf", "topk_rbf", "topk_rbf_gate", "topk_rbf_ptlocal", "topk_rbf_glres"]
gather_topk: 32                # query-side top-k gather
sensor_local_topk: 16           # sensor-side local graph neighborhood
gather_query_chunk_size: 1024  # Process query points in chunks to cap peak GPU memory on 3D DNS.
learnable_rbf_sigma: true
neighbor_backend: "keops"
sensor_local_dropout: 0.0

# ----------------------------------------------------------
# Regular-grid specification required by the FNO baseline
# These MUST be provided and must match the dataset, otherwise training will warn and exit.
# ----------------------------------------------------------
Num_x: 403
Num_y: 100
# ----------------------------------------------------------
# Hyperparameters for FNO backbone
# The tensor fed to FNO is shaped [B, C, Num_y, Num_x], so modes are specified separately along x and y.
# ----------------------------------------------------------
fno_modes_x: 24
fno_modes_y: 12
fno_hidden_channels: 96
fno_n_layers: 4
condition_blur: true
condition_blur_kernel: 11
condition_blur_sigma: 1.75

# ----------------------------------------------------------
# These are hyperparameters for the training process
# ----------------------------------------------------------
n_query_points : 8192       # Number of query points to be evaluated in training process
query_sampling: "obs_mix"   # "obs_mix" or "uniform"
query_sample_near_ratio: 0.25
query_sample_far_ratio: 0.25
query_sample_sigma_ratio: 0.05
prior : "rff"            # choices=["iid", "rff"]; idd, Independent and Identically Distributed, standard diffusion; RFF, Random Fourier Features
rff_features : 256
rff_lengthscale : 0.15

eval_every : 5
save_every : 200         # Saving reconstruction visualizations after save_every epochs to validate reconstruction quality
n_steps_generation : 32  # Fallback single reconstruction NFE if benchmark_n_steps is omitted.

# Setting up the conditioning process
cond_fields :   [0, 1, 2, 3]      # ["Ux", "Uy", "Uz", "p"]
n_obs_min_list: [1953]  # Per-field minimum sensors. Length 1 broadcasts to all cond_fields. 125^3 grid, 0.1%=1953, 1% = 19531, 5% = 97656
n_obs_max_list: [19531] # Per-field maximum sensors. 1% of 125^3=1,953,125 — matches baseline's budget.

vis_cond_fields:            # help="Visualization conditioned fields. Defaults to cond_fields if None
vis_n_obs_list:  # Visualization exact sensors per field. Defaults to n_obs_max_list.

# ===== Rectified Flow generation controls =====
ode_solver : "euler"
benchmark_n_steps : [2, 4, 16]
