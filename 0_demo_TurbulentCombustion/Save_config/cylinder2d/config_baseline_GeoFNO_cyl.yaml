# =============================================================================
# PoF-benchmark 2D cylinder — GeoFNO (fno variant) on the 200x400 uniform ROI
# grid companion file (80000 pts, body interior zeroed; the mesh file is not
# grid-reshapeable). Re-holdout protocol identical to config_baseline_Det_cyl:
# JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0, train_ratio 0.6667 = frames [0,1200)
# train Re{60,100,150,200} / [1200,1800) held-out Re{80,250}.
# Sensors 0.1-1% of 80000 grid pts per observed field; p never observed.
# Budget ~50k steps: bs 32 -> 37 steps/epoch -> 1300 epochs ~= 48k.
# =============================================================================

baseline_model: "geofno"  # `mlp_rbf`, `senseiver`, or `geofno`
training_stage: 1

shared:
  demo_num: 75
  seed: 42
  device_ids: [0]
  reload: true

  paths:
    data_path: "/projects/ammoniacomb/generative_reconstruction/cylinder2d/Cylinder2D_grid.h5"
    save_root: "Save_TrainedModel/cylinder2d/baseline_geofno"
    config_backup_root: "Save_config/cylinder2d/det_baseline"

  data:
    dataset_name: "cylinder2d"
    train_ratio: 0.6667
    time_stride: 1
    num_workers: 4
    num_x: 400               # grid_shape [200, 400], x fastest in the H5
    num_y: 200
    field_names: ["Ux", "Uy", "p"]

  conditioning:
    cond_fields: [0, 1]        # velocities observed; p never observed
    n_obs_min_list: [80]       # 0.1% of 80000, broadcast to both fields
    n_obs_max_list: [800]      # 1%
    vis_cond_fields: [0, 1]
    vis_n_obs_list: [800]

  logging:
    eval_every: 5
    save_every: 500

  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

mlp_rbf_params:
  training:
    epochs: 5000
    batch_size: 128
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500
    n_query_points: 4096

  architecture:
    coord_dim: 3   # 3-wide coord convention (constant z=0.5)
    hidden_dim: 256
    cond_dim: 128
    field_embed_dim: 128
    rbf_sigma: 0.05
    use_fourier_pe: true
    fourier_pe_num_bands: 32
    fourier_pe_max_freq: 64.0

senseiver_params:
  training:
    epochs: 5000
    batch_size: 128
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500
    n_query_points: 4096

  architecture:
    coord_dim: 2
    num_latents: 128
    latent_dim: 128
    num_encoder_layers: 3
    num_self_attn_per_block: 3
    num_cross_attn_heads: 8
    num_self_attn_heads: 8
    dec_num_cross_attn_heads: 8
    field_embed_dim: 32
    space_bands: 32
    max_freq: 64.0
    ff_mult: 4
    dropout: 0.0

geofno_params:
  training:
    epochs: 1300
    batch_size: 32
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500

  architecture:
    geofno_variant: "fno"
    fno_modes_x: 32            # 400 pts in x
    fno_modes_y: 24            # 200 pts in y — keep the 2:1 aspect in modes
    fno_hidden_channels: 64
    fno_n_layers: 4

    latent_Nx: 64
    latent_Ny: 64
    gno_radius: 0.1
    gno_transform_type: "linear"
