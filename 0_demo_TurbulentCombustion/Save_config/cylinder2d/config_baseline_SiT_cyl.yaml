# =============================================================================
# PoF-benchmark 2D cylinder — latent flow matching (2-stage, spatial_dim 2
# engages via absent num_z) on the 200x400 uniform ROI grid companion file
# (80000 pts, body interior zeroed). Re-holdout protocol identical to
# config_baseline_Det_cyl: JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0, train_ratio
# 0.6667 = frames [0,1200) train Re{60,100,150,200} / [1200,1800) held-out
# Re{80,250}. Sensors 0.1-1% of 80000 per observed field; p never observed.
# Budget ~50k steps/stage: s1 bs 8 -> 150 steps/ep -> 350 ep = 52.5k;
# s2 bs 64 -> 18 steps/ep -> 2600 ep ~= 48k.
# =============================================================================

baseline_model: sit
training_stage: 1              # run stage 1 then stage 2 (LFM_STAGE pattern)

shared:
  demo_num: 73
  seed: 42
  device_ids: [0]
  reload: true

  paths:
    data_path: "/projects/ammoniacomb/generative_reconstruction/cylinder2d/Cylinder2D_grid.h5"
    save_root: "Save_TrainedModel/cylinder2d/baseline_sit"
    config_backup_root: "Save_config/cylinder2d/gen_baseline"

  data:
    dataset_name: "cylinder2d"
    train_ratio: 0.6667
    time_stride: 1
    num_workers: 4
    num_x: 400                 # grid_shape [200, 400], x fastest in the H5
    num_y: 200
    field_names: ["Ux", "Uy", "p"]

  conditioning:
    cond_fields: [0, 1]        # velocities observed; p never observed
    n_obs_min_list: [80]       # 0.1% of 80000, broadcast to both fields
    n_obs_max_list: [800]      # 1%
    vis_cond_fields: [0, 1]
    vis_n_obs_list: [800]

  logging:
    eval_every: 5
    save_every: 500

  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

s3gm_params:
  training:
    epochs: 340                 # bs 8 -> 150 steps/ep -> 51k steps (budget-matched)
    batch_size: 8
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 200

  architecture:
    nf: 128
    ch_mult: [1, 2, 4, 8]
    num_res_blocks: 2
    attn_resolutions: [8]
    num_heads: 1
    dropout: 0.1
    use_checkpoint: true        # 200x400 UNet activations exceed the 256^2 budget

  diffusion:
    sigma_min: 0.1
    sigma_max: 7.0
    num_scales: 1000
    ema_rate: 0.999

  sampling:
    sampling_N: 200
    snr: 0.128
    n_corrector_steps: 5
    alpha_obs: 1.0
    benchmark_n_steps: [200]

latent_fm_params:
  stage1:
    architecture:
      base_ch: 64
      latent_ch: 128
      n_levels: 3
    training:
      epochs: 350
      batch_size: 8
      learning_rate: 1.0e-4
      weight_decay: 1.0e-6
      eval_every: 5
      save_every: 50

  stage2:
    architecture:
      base_ch: 64
      ch_mult: [1, 2]
      num_res_blocks: 3
      num_heads: 8
      ema_decay: 0.999
    conditioning:
      cond_mode: image
      pointnet_hidden_mult: 1.0
    training:
      epochs: 2600
      batch_size: 64
      learning_rate: 1.0e-4
      weight_decay: 0.0
      eval_every: 5
      save_every: 200
    sampling:
      ode_solver: euler
      benchmark_n_steps: [2, 4, 8, 16]
    stage1_checkpoint:

sit_params:
  training:
    epochs: 1300
    batch_size: 32
    learning_rate: 5.0e-5
    weight_decay: 0.0001
    eval_every: 5
    save_every: 500
    adam_eps: 1.0e-6
    huber_beta: 0.1

  architecture:
    patch_size: 8               # 200/8 x 400/8 = 25x50 = 1250 tokens
    hidden_size: 256
    depth: 8
    num_heads: 4
    mlp_ratio: 4.0
    tokenizer: "patch"
    coord_dim: 2
    fourier_num_freqs: 64
    fourier_scale: 10.0
    ema_rate: 0.9999

  transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight:

  conditioning:
    cond_mode: "interp"

  sampling:
    sampling_N: 50
    ode_solver: "euler"
    benchmark_n_steps: [4, 16, 32, 64]
