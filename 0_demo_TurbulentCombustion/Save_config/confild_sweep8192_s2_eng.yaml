# CoNFiLD stage-1 latent sweep — ARM sweep-8192 (added 2026-09-02).
# Pushes the latent-capacity direction toward the codec target (max-channel
# rel-L2 <= 0.18). Parameter count is explicitly NOT a constraint for this arm.
# Rationale: latent scaling is compute-CHEAP here — the FiLM projection is
# applied per ITEM, not per point, so sweep4096's 17.8M decoder runs at ~31 s/
# epoch, the same as sweep1024's 5.2M. Decoder WIDTH is per-point and costs ~4x
# per doubling, so latent is the efficient lever at ~-12% codec per doubling.
# attention_resolutions "256,128,64" @ image_size 8192 -> attention_ds
# [32,64,128], identical to every other arm (the string is image_size-relative;
# an unscaled string would silently remove ALL attention).
# Expected: decoder 34,543,364; latent table 7,200 x 8192 = 58,982,400.
