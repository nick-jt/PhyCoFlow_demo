# =============================================================================
# SiT point-token generative baseline on the JHU cross-cube protocol.
# -----------------------------------------------------------------------------
# Point-tokenized DiT (pointnet tokenizer, coord_dim 3) with rectified-flow
# transport: the "good point architecture + flow matching" generative
# competitor the main turbulence comparison needs. Token budget per step is
# node_subsample (uniform random nodes); sensors are drawn from the FULL
# field under the identical protocol and reach the tokens via nearest-sensor
# fill (value + soft support per conditioned field). Sampling reconstructs
# the full 125^3 field in independent token chunks: pointwise metrics
# (relL2/CRPS/coverage) are well defined; single-sample coherence is limited
# to the chunk size (documented as a property of this baseline).
# Depth 6 x hidden 256 keeps the parameter count near the 6.5M budget shared
# by LOCUS and the latent-FM baseline.
# =============================================================================

baseline_model: sit
training_stage: 1

shared:
  demo_num: 41
  seed: 42
  device_ids: [0]
  reload: true

  paths:
    data_path: /projects/ammoniacomb/generative_reconstruction/jhu_homogeneous_turbulence/outputfiles_diverse/JHU_4cubes_stride100.h5
    save_root: Save_TrainedModel/JHU/baseline_sit
    config_backup_root: Save_config/isotropic_turbulence/sit

  data:
    dataset_name: turbulent_combustion
    field_names: ["Ux", "Uy", "Uz", "p"]
    train_ratio: 0.75
    time_stride: 1
    num_workers: 4
    num_x: 125
    num_y: 125
    num_z: 125

  conditioning:
    cond_fields: [0, 2]
    n_obs_min_list: [1953]
    n_obs_max_list: [19531]
    vis_cond_fields: [0, 2]
    vis_n_obs_list: [19531]

  logging:
    eval_every: 5
    save_every: 3000

  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

sit_params:
  training:
    epochs: 6000
    batch_size: 24
    learning_rate: 5.0e-5
    weight_decay: 0.0001
    eval_every: 5
    save_every: 3000
    adam_eps: 1.0e-6
    huber_beta: 0.1

  architecture:
    patch_size: 4              # unused in pointnet mode
    hidden_size: 256
    depth: 6
    num_heads: 4
    mlp_ratio: 4.0
    tokenizer: "pointnet"
    coord_dim: 3
    fourier_num_freqs: 64
    fourier_scale: 10.0
    ema_rate: 0.9999
    node_subsample: 8192       # token budget per step / sampling chunk
    cond_fill_sigma: 0.05      # soft-support bandwidth for nearest-sensor fill

  transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight:

  conditioning:
    cond_mode: "interp"        # label only in pointnet mode (nearest fill)

  sampling:
    sampling_N: 32
    ode_solver: "euler"
    benchmark_n_steps: [32]
