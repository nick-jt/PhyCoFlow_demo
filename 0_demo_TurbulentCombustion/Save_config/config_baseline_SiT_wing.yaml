# =============================================================================
# SiT (point-token DiT + rectified flow) on SHIFT-WING.
# -----------------------------------------------------------------------------
# Replaces the never-launched staged version of this file, which carried the
# JHU sensor budgets (cond_fields [0,2], n_obs 1953..19531), no surface-pool
# key, hidden_size 256 / depth 8 with no parameter-count justification, and
# no node_subsample. Trained through train_Gen_Baseline.py.
#
# The fairness contract is identical to config_baseline_wing_senseiver.yaml
# (read that header for the full statement). Summary:
#
#   1. CONDITIONING  shared.conditioning.source: surface_pool -- sensors from
#      the 65,536-point body-surface pool + the two exact parameter tokens,
#      built by the same helpers.build_sparse_condition_from_pool /
#      append_extra_tokens pair our model uses. The default volume draw is
#      refused on this dataset.
#   2. PARAMETERS    6,574,324 trainable (+1.0% vs our 6,506,893), measured by
#      src/wing_param_probe.py at hidden_size 240 / depth 6 (the xcube
#      point-token SiT layout is 256/6; 240 absorbs the wider conditioning
#      stack described below).
#   3. STEP BUDGET   4000 epochs x 75 steps = 300,000 steps; batch_size 8
#      matched to the v3 run.
#   4. SPLIT/AUG/NORM  frozen 600/73 split from stats.json; WING_AUGMENT
#      deliberately unset (our v3 run did not use it -- note that the previous
#      staged launcher train_sit_wing.sh DID export WING_AUGMENT=reflect_y,
#      which would have trained this baseline on a different data
#      distribution from ours); shared dataset stats.
#
# ---------------------------------------------------------------------------
# HOW SiT RECEIVES THE SENSORS (and the parameter tokens)
# ---------------------------------------------------------------------------
# SiT has no per-sensor token: conditioning is a dense per-node channel stack,
# indexed BY FIELD ID. Two consequences on this dataset, both handled:
#
#   * the stack is widened from 2*n_fields+1 = 9 channels to
#     2*n_obs_field_types+1 = 19, because a wing sensor may carry field id
#     0-8 and a 4-wide value stack cannot even hold a wall-shear reading.
#     This is a dense, slightly wasteful representation of field identity
#     rather than a learned embedding -- a real difference from Senseiver and
#     MLP-RBF, recorded here.
#
#   * the parameter tokens ARE delivered, and unlike MLP-RBF they are
#     delivered everywhere: helpers_wing_baseline.wing_fill_nodes broadcasts
#     the Mach/alpha channels to every token at support 1.0, because they are
#     exactly-known global scalars. Routing them through the same
#     exp(-d^2/2 sigma^2) decay as a pressure tap would zero them out for all
#     but the nodes near (0.5, 0.5, 0.5) and silently discard the flow
#     conditions.
#
# node_subsample 8192 is the per-step token budget (the mesh has 400,000
# nodes; full self-attention over them is not feasible). Surface sensors are
# essentially never members of a volume token subset, so conditioning reaches
# tokens geometrically through the nearest-sensor fill -- the same path the
# xcube point-token SiT uses. Sampling reconstructs the full field in
# independent 8192-node chunks: pointwise metrics (rel-L2, CRPS, coverage)
# are well defined, single-sample coherence is limited to the chunk, and that
# is a documented property of this baseline.
#
# The full-node path (scatter_sensors_to_nodes) is REFUSED on this dataset:
# it treats obs_indices as volume indices, but surface-pool indices address
# the 65,536-node surface, so it would write sensor values onto arbitrary
# interior nodes. model_baseline.py raises rather than doing that silently.
# =============================================================================

baseline_model: sit
training_stage: 1

shared:
  demo_num: 52
  seed: 42
  device_ids: [0]
  reload: true

  paths:
    data_path: /projects/ammoniacomb/generative_reconstruction/shift_wing/processed_v3
    save_root: Save_TrainedModel/wing/baseline_sit
    config_backup_root: Save_config/wing/sit

  data:
    dataset: shiftwing
    dataset_name: shift_wing
    # Kestrel path: the wing trainings (18745893-95) are running here now.
    # On Delta swap to: /work/hdd/bilr/ntricard/datasets/shift_wing_processed_v3
    processed_root: /projects/ammoniacomb/generative_reconstruction/shift_wing/processed_v3
    train_ratio: 0.9        # unused: split frozen in stats.json
    time_stride: 1
    num_workers: 6
    num_x: 125              # decorative on an unstructured mesh
    num_y: 125
    num_z: 125

  conditioning:
    source: surface_pool
    n_obs_min_list: [64, 16, 16, 16]
    n_obs_max_list: [4096, 1024, 1024, 1024]
    cond_fields: [3]        # informational only in pool mode
    vis_cond_fields: [3]
    vis_n_obs_list: [4096, 1024, 1024, 1024]

  logging:
    eval_every: 25
    save_every: 1000000     # disables the JHU/grid visualize path

  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

sit_params:
  training:
    epochs: 4000            # x 75 steps/epoch = 300,000 steps (matched)
    batch_size: 8
    learning_rate: 5.0e-5
    weight_decay: 0.0001
    eval_every: 25
    save_every: 1000000
    adam_eps: 1.0e-6
    huber_beta: 0.0         # original SiT MSE velocity loss (see xcube config)

  architecture:
    patch_size: 4           # unused in pointnet mode
    hidden_size: 240        # 256 -> 240 for the 6.51M budget
    depth: 6
    num_heads: 4
    mlp_ratio: 4.0
    tokenizer: "pointnet"   # per-node embedder for irregular meshes
    coord_dim: 3
    fourier_num_freqs: 64
    fourier_scale: 10.0
    ema_rate: 0.9999
    node_subsample: 8192    # token budget per step / sampling chunk
    cond_fill_sigma: 0.05   # soft-support bandwidth for nearest-sensor fill
    allow_large_token_count: true   # 8192 tokens, accepted deliberately

  transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight:

  conditioning:
    cond_mode: "interp"     # label only in pointnet mode (nearest fill)

  sampling:
    sampling_N: 32
    ode_solver: "euler"
    benchmark_n_steps: [4, 16, 32]
